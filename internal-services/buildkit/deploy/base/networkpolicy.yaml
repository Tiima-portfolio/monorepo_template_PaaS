# Only runner pods may reach the daemon. The overlay sets which pool's runners.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: buildkit
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: buildkit
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: arc-runners
          podSelector:
            matchLabels:
              factory.dev/runner-pool: <pool>
      ports:
        - port: 1234
