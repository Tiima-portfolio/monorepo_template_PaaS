# Actions Runner Controller scale set: PR jobs: read-only cache, no secrets.
# helm install factory-pr oci://<internal-registry>/actions-runner-controller-charts/gha-runner-scale-set -f pr.values.yaml
githubConfigUrl: https://github.com/<owner>/<repo>
githubConfigSecret: factory-runner-github-app
runnerScaleSetName: factory-pr
minRunners: 2
maxRunners: 200
template:
  spec:
    containers:
      - name: runner
        # Runner image from the internal registry, with Node, mise and the
        # toolchains' tools baked in, so jobs don't download them.
        image: <internal-registry>/factory/runner:<version>
        command: ["/home/runner/run.sh"]
        env:
          - name: NX_SELF_HOSTED_REMOTE_CACHE_SERVER
            value: https://nx-cache.<internal-domain>
          - name: NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN
            valueFrom:
              secretKeyRef:
                name: factory-nx-cache
                key: read-only-token
