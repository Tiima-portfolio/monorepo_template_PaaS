# Rust. In the air-gapped network, a Cargo source replacement in
# .cargo/config.toml points at the internal crate mirror.
setup:
  mise:
    rust: { version: "1.99.0", components: "rustfmt,clippy" }
targets:
  lint:
    command: cargo fmt --check && cargo clippy --all-targets -- -D warnings
    inputs: ["{projectRoot}/src/**/*", "{projectRoot}/tests/**/*", "{projectRoot}/Cargo.toml", "{projectRoot}/Cargo.lock"]
  test:
    command: cargo test
    inputs: ["{projectRoot}/src/**/*", "{projectRoot}/tests/**/*", "{projectRoot}/Cargo.toml", "{projectRoot}/Cargo.lock"]
  build:
    command: cargo build --release
    dependsOn: ["^build"]
    inputs: ["{projectRoot}/src/**/*", "{projectRoot}/Cargo.toml", "{projectRoot}/Cargo.lock"]
    outputs: ["{projectRoot}/target/release/{name}"]
  package:
    # FACTORY_VERSION is set by the release job.
    command: mkdir -p dist && tar -czf "dist/{name}-${FACTORY_VERSION:-0.0.0}.tar.gz" -C target/release {name}
    dependsOn: [build]
    outputs: ["{projectRoot}/dist/{name}-*.tar.gz"]
