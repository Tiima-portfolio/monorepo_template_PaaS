# Python with uv. In the air-gapped network, UV_INDEX_URL points at the
# internal package mirror.
setup:
  mise:
    python: "3.13"
    uv: "0.12.23"
targets:
  lint:
    command: uv run ruff check . && uv run ruff format --check .
    inputs: ["{projectRoot}/**/*.py", "{projectRoot}/pyproject.toml", "{projectRoot}/uv.lock"]
  test:
    # Also writes coverage/lcov.info for the factory's diff coverage. pytest-cov
    # comes from the package index (the internal mirror), not the project.
    command: mkdir -p coverage && COVERAGE_FILE=coverage/.coverage uv run --with pytest-cov pytest -q --cov=src --cov-report=lcov:coverage/lcov.info
    outputs: ["{projectRoot}/coverage"]
    inputs: ["{projectRoot}/**/*.py", "{projectRoot}/pyproject.toml", "{projectRoot}/uv.lock"]
  build:
    # FACTORY_VERSION is set by the release job; local builds stay 0.0.0.
    command: uv version --frozen "${FACTORY_VERSION:-0.0.0}" && uv build --wheel --out-dir dist
    dependsOn: ["^build"]
    inputs: ["{projectRoot}/src/**/*.py", "{projectRoot}/pyproject.toml", "{projectRoot}/uv.lock"]
    outputs: ["{projectRoot}/dist"]
  package:
    command: ls dist/*.whl
    dependsOn: [build]
  # Mutation testing with mutmut (from the package index), converted to the
  # factory's mutation/report.json.
  mutation:
    command: uv run --with mutmut mutmut run >/dev/null; uv run --with mutmut python {toolchainDir}/mutmut_report.py
    inputs: ["{projectRoot}/src/**/*.py", "{projectRoot}/tests/**/*.py", "{projectRoot}/pyproject.toml"]
    outputs: ["{projectRoot}/mutation"]
