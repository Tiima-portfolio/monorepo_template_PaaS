# TypeScript on Node 24, which runs .ts files natively. TypeScript itself is a
# devDependency of each project, pinned in the project's own lock file.
# CI runs these targets in this image (image/ here), pinned by digest.
image: ghcr.io/tiima-portfolio/monorepo_template_paas/ci-typescript:1a40a0829054@sha256:e25601416bc4c7666d0e8f04b7da4ad1105fc1662961967e6374ec01101230ae
setup:
  mise:
    node: "24"
targets:
  install:
    command: npm ci --no-audit --no-fund
    cache: false
  lint:
    command: npx tsc --noEmit
    dependsOn: [install]
    inputs: ["{projectRoot}/**/*", "!{projectRoot}/dist/**", "!{projectRoot}/node_modules/**"]
  test:
    # Also writes coverage/lcov.info for the factory's diff coverage.
    command: mkdir -p coverage test-results && node --test --experimental-test-coverage --test-reporter=spec --test-reporter-destination=stdout --test-reporter=lcov --test-reporter-destination=coverage/lcov.info --test-reporter=junit --test-reporter-destination=test-results/junit.xml
    dependsOn: [install]
    outputs: ["{projectRoot}/coverage", "{projectRoot}/test-results"]
    inputs: ["{projectRoot}/**/*", "!{projectRoot}/dist/**", "!{projectRoot}/node_modules/**"]
  build:
    command: npx tsc
    dependsOn: [install, "^build"]
    inputs: ["{projectRoot}/**/*", "!{projectRoot}/dist/**", "!{projectRoot}/node_modules/**"]
    outputs: ["{projectRoot}/dist"]
  package:
    # FACTORY_VERSION is set by the release job; local packages stay 0.0.0.
    command: npm version "${FACTORY_VERSION:-0.0.0}" --no-git-tag-version --allow-same-version && npm pack --pack-destination dist
    dependsOn: [build]
    outputs: ["{projectRoot}/dist/*.tgz"]
  # Mutation testing with Stryker (from the package mirror), converted to the
  # factory's mutation/report.json.
  mutation:
    command: mkdir -p mutation && npx --yes @stryker-mutator/core@10.0.0 run {toolchainDir}/stryker.json && node {toolchainDir}/stryker-report.mjs
    dependsOn: [install]
    inputs: ["{projectRoot}/src/**/*"]
    outputs: ["{projectRoot}/mutation"]
