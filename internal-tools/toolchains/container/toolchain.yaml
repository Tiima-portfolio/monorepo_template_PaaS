# Container images built with BuildKit (docker buildx). Listed after a language
# toolchain, for example [go, container], its targets run after that
# language's targets of the same name: the image is built from the binary.
# In the air-gapped network, base images come from the internal registry and
# are pinned by digest. buildx.mjs builds through the shared BuildKit service
# (internal-services/buildkit) when FACTORY_BUILDKIT_ADDR is set, and with
# the local BuildKit otherwise.
setup:
  mise:
    hadolint: "2.15.1"
targets:
  lint:
    command: hadolint Dockerfile
    # The generic lint image (lint-image/ here), pinned by digest. The other
    # targets build images, so they use BuildKit on the host.
    image: ghcr.io/tiima-portfolio/monorepo_template_paas/ci-lint:33adae933966@sha256:c9c6d25f4cae5d69ac8ba74090e16cd4261374166e1f195b32af69b4591fbff9
    inputs: ["{projectRoot}/Dockerfile"]
  build:
    command: node {toolchainDir}/buildx.mjs {name} --load -t {name}:ci .
    cache: false
  test:
    command: if [ -x container-test.sh ]; then ./container-test.sh {name}:ci; else docker run --rm {name}:ci; fi
    dependsOn: [build]
    cache: false
  package:
    # A docker save archive works with the default docker driver and the
    # service; the OCI exporter needs a separate BuildKit container builder.
    command: mkdir -p dist && node {toolchainDir}/buildx.mjs {name} --output type=docker,dest=dist/{name}-image.tar -t "{name}:${FACTORY_VERSION:-0.0.0}" .
    cache: false
