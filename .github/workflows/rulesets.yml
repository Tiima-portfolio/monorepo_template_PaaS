# Daily check that the live rulesets still match .github/rulesets/.
name: rulesets

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/rulesets/**"]

permissions:
  contents: read

jobs:
  drift:
    name: factory/rulesets
    runs-on: ${{ vars.FACTORY_RUNNER_MAIN || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # With FACTORY_ADMIN_TOKEN (administration write) drift is re-applied;
      # without it, drift is reported and the job fails.
      - name: Check or re-apply
        env:
          GH_TOKEN: ${{ secrets.FACTORY_ADMIN_TOKEN || github.token }}
          HAS_ADMIN: ${{ secrets.FACTORY_ADMIN_TOKEN != '' }}
        run: |
          if [ "$HAS_ADMIN" = "true" ]; then
            node ci/factory/rulesets.mjs apply
          else
            node ci/factory/rulesets.mjs check
          fi
