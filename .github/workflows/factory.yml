# The factory: one pipeline for every PR and every merge queue group, from
# humans and agents alike. The only required check is "factory/admission".
name: factory

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]
  merge_group:
  # The post-merge check: main is verified again, since without a merge queue
  # the squash commit can differ from what the PR verified.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: factory-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: true

env:
  NX_DAEMON: "false"
  NX_NO_CLOUD: "true"
  FACTORY_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
  FACTORY_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
  FACTORY_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
  FACTORY_OUT: factory-out

jobs:
  gate:
    name: factory/gate
    # Runner pools are set per repository; GitHub-hosted runners by default.
    runs-on: ${{ github.event_name == 'push' && (vars.FACTORY_RUNNER_MAIN || 'ubuntu-latest') || github.event_name == 'merge_group' && (vars.FACTORY_RUNNER_QUEUE || 'ubuntu-latest') || (vars.FACTORY_RUNNER_PR || 'ubuntu-latest') }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      tier: ${{ steps.gate.outputs.tier }}
      affected: ${{ steps.gate.outputs.affected }}
      has_tools: ${{ steps.gate.outputs.has_tools }}
      escape_fix: ${{ steps.gate.outputs.escape_fix }}
      hard_minutes: ${{ steps.gate.outputs.hard_minutes }}
      owner_checks: ${{ steps.gate.outputs.owner_checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FACTORY_HEAD }}
          fetch-depth: 0
      # The gate's code and policy come from the base branch, so a PR is
      # always judged by the rules already on main, never by its own changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FACTORY_BASE }}
          path: .factory
          sparse-checkout: ci
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Use gate code from the base branch
        run: |
          if [ -f .factory/ci/factory-py/run.py ]; then
            code=.factory/ci
          else
            echo "::warning::The base branch has no gate yet; using this PR's gate code (bootstrap only)."
            code=ci
          fi
          echo "FACTORY_CODE=$code" >> "$GITHUB_ENV"
          echo "FACTORY_RUN=uv run --frozen --project $code/factory-py $code/factory-py/run.py" >> "$GITHUB_ENV"
      - name: Check who added the override label
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'boundary-override')
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          actor=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/events" --paginate \
            --jq '[.[] | select(.event == "labeled" and .label.name == "boundary-override")] | last | .actor.login')
          perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$actor/permission" --jq .permission)
          echo "Override label added by $actor ($perm)"
          # Factory owners: repository admins here; an org uses the team in boundaries.yaml.
          [ "$perm" = "admin" ] && echo "FACTORY_OVERRIDE_OK=true" >> "$GITHUB_ENV" || true
      - name: Quarantine list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues?labels=quarantine&state=open&per_page=100" \
            --jq '[.[] | {title, created_at}]' > quarantine.json
      - name: Gate
        id: gate
        # Hard limit for the gate itself, from ci/policy/budgets.yaml.
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: FACTORY_QUARANTINE_FILE=quarantine.json FACTORY_POLICY_DIR="$FACTORY_CODE/policy" $FACTORY_RUN gate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: factory-gate
          path: factory-out
          retention-days: 7

  verify:
    name: factory/verify
    needs: gate
    # Draft PRs run only the gate; build and tests start when marked ready.
    if: needs.gate.outputs.affected != '0' && !github.event.pull_request.draft
    # The tier's hard limit for PR feedback, from ci/policy/budgets.yaml.
    timeout-minutes: ${{ fromJSON(needs.gate.outputs.hard_minutes || '60') }}
    permissions:
      contents: read
      issues: read
    runs-on: ${{ github.event_name == 'push' && (vars.FACTORY_RUNNER_MAIN || 'ubuntu-latest') || github.event_name == 'merge_group' && (vars.FACTORY_RUNNER_QUEUE || 'ubuntu-latest') || (vars.FACTORY_RUNNER_PR || 'ubuntu-latest') }}
    env:
      FACTORY_AFFECTED: ${{ needs.gate.outputs.affected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FACTORY_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The script that records results comes from the base branch, so a PR
      # can't change how its own results are written down.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FACTORY_BASE }}
          path: .factory
          sparse-checkout: ci
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Use the base branch's record and test scripts
        run: |
          py=.factory/ci/factory-py
          [ -f "$py/run.py" ] || py=ci/factory-py
          echo "FACTORY_RUN=uv run --frozen --project $py $py/run.py" >> "$GITHUB_ENV"
      - name: Quarantine list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues?labels=quarantine&state=open&per_page=100" \
            --jq '[.[] | {title, created_at}]' > quarantine.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-gate
          path: gate
      # Toolchain versions come from each affected toolchain's toolchain.yaml.
      - name: Toolchain setup file
        if: needs.gate.outputs.has_tools == 'true'
        run: cp gate/mise.toml mise.local.toml
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        if: needs.gate.outputs.has_tools == 'true'
      # The shared BuildKit service, when the repository configures it: main
      # pushes use the main instance and write the layer cache; PRs and the
      # merge queue use the PR instance and only read it. Unset: local BuildKit.
      - uses: ./.github/actions/buildkit-service
        with:
          addr: ${{ github.event_name == 'push' && vars.FACTORY_BUILDKIT_ADDR_MAIN || github.event_name != 'push' && vars.FACTORY_BUILDKIT_ADDR || '' }}
          tls: ${{ github.event_name == 'push' && secrets.FACTORY_BUILDKIT_MAIN_TLS || github.event_name != 'push' && secrets.FACTORY_BUILDKIT_TLS || '' }}
          cache-ref: ${{ vars.FACTORY_BUILDKIT_CACHE_REF }}
          cache-write: ${{ github.event_name == 'push' }}
      - name: Lint
        run: |
          set +e
          npx nx affected -t lint --base="$FACTORY_BASE" --head="$FACTORY_HEAD" --outputStyle=static
          code=$?
          $FACTORY_RUN verify-record format-lint "$code" "nx affected -t lint"
      - name: Build
        run: |
          set +e
          npx nx affected -t build --base="$FACTORY_BASE" --head="$FACTORY_HEAD" --outputStyle=static
          code=$?
          $FACTORY_RUN verify-record build "$code" "nx affected -t build"
      - name: Unit tests
        # Retries, flake confirmation and quarantine: see ci/factory-py/factory/flaky.py.
        run: FACTORY_QUARANTINE_FILE=quarantine.json $FACTORY_RUN test-run
      - name: Owners' required checks
        if: needs.gate.outputs.owner_checks != ''
        env:
          OWNER_CHECKS: ${{ needs.gate.outputs.owner_checks }}
        run: |
          code=0
          for check in $OWNER_CHECKS; do
            npx nx run "$check" --outputStyle=static || code=1
          done
          $FACTORY_RUN verify-record owner-checks "$code" "$OWNER_CHECKS"
      - name: Regression test (escape-fix)
        if: needs.gate.outputs.escape_fix == 'true'
        run: |
          $FACTORY_RUN regression
      - name: Mutation score (R2 and above)
        if: needs.gate.outputs.tier == 'R2' || needs.gate.outputs.tier == 'R3'
        run: |
          npx nx affected -t mutation --base="$FACTORY_BASE" --head="$FACTORY_HEAD" --outputStyle=static || true
          FACTORY_GATE=gate/gate.json $FACTORY_RUN mutation
      # main's coverage per project, for the ratchet. Caches saved on main are
      # readable from PRs, but a PR can't write to main's cache scope.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: factory-metrics.json
          key: factory-metrics-${{ github.run_id }}
          restore-keys: factory-metrics-
      - name: Diff coverage and ratchet
        run: |
          FACTORY_GATE=gate/gate.json FACTORY_METRICS_FILE=factory-metrics.json $FACTORY_RUN diff-coverage
      - name: Record main's coverage
        if: github.event_name == 'push'
        run: $FACTORY_RUN metrics factory-metrics.json "$FACTORY_OUT/coverage-totals.json" "$GITHUB_SHA"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push'
        with:
          path: factory-metrics.json
          key: factory-metrics-${{ github.run_id }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: factory-verify
          path: factory-out
          retention-days: 7

  admission:
    name: factory/admission
    needs: [gate, verify]
    if: always()
    runs-on: ${{ github.event_name == 'push' && (vars.FACTORY_RUNNER_MAIN || 'ubuntu-latest') || github.event_name == 'merge_group' && (vars.FACTORY_RUNNER_QUEUE || 'ubuntu-latest') || (vars.FACTORY_RUNNER_PR || 'ubuntu-latest') }}
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FACTORY_BASE }}
          sparse-checkout: ci
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: hashFiles('ci/factory-py/run.py') == ''
        with:
          ref: ${{ env.FACTORY_HEAD }}
          sparse-checkout: ci
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: factory-*
          path: factory-in
      - name: Job results from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '[.jobs[] | {name, conclusion}]' > jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '{path, head_sha, run_started_at}' > run.json
      - name: Current approvals
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --paginate \
            --jq '[group_by(.user.login)[] | last | select(.state == "APPROVED") | .user.login]' | jq -s 'add // []' > approvers.json
      - name: Admission
        run: FACTORY_IN=factory-in FACTORY_OUT=. FACTORY_JOBS_FILE=jobs.json FACTORY_RUN_FILE=run.json FACTORY_APPROVERS_FILE=approvers.json uv run --frozen --project ci/factory-py ci/factory-py/run.py admission
      - name: Quarantine confirmed flaky tests
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=factory-in/factory-verify/flaky.json
          [ -f "$f" ] || exit 0
          jq -r '.[]' "$f" | while IFS= read -r t; do
            title="quarantine: $t"
            open=$(gh api "repos/$GITHUB_REPOSITORY/issues?labels=quarantine&state=open&per_page=100" --jq "[.[] | select(.title == \"$title\")] | length")
            if [ "$open" = "0" ]; then
              gh api "repos/$GITHUB_REPOSITORY/issues" -f title="$title" -f labels[]=quarantine \
                -f body="The test $t failed and then passed on the same commit, and 20 reruns both passed and failed, so it is flaky. It is quarantined for at most 5 working days: until then its failures only block if it fails three runs in a row, and its project's PRs are one risk tier up. Fix or remove the flaky test, then close this issue. Found on $FACTORY_SHA." >/dev/null
              echo "Quarantined $t"
            fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && hashFiles('bundle.json') != ''
        with:
          name: factory-evidence
          path: bundle.json
          retention-days: 90
      - name: Post the decision on the PR
        if: always() && github.event_name == 'pull_request' && hashFiles('admission.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- factory-admission -->'
          body="$marker"$'\n'"$(cat admission.md)"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null
          fi

  # A red main is reverted, not left for everyone to investigate: the factory
  # opens a P0 revert PR of the commit that failed the post-merge check.
  revert:
    name: factory/revert
    needs: admission
    if: failure() && github.event_name == 'push'
    runs-on: ${{ vars.FACTORY_RUNNER_MAIN || 'ubuntu-latest' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      HAS_APP: ${{ secrets.FACTORY_APP_PRIVATE_KEY != '' && secrets.FACTORY_APP_ID != '' }}
    steps:
      # A short-lived token for the factory GitHub App, minted from the
      # FACTORY_APP_ID and FACTORY_APP_PRIVATE_KEY secrets. Without them the
      # job falls back to GITHUB_TOKEN.
      - id: app
        if: env.HAS_APP == 'true'
        # If the App isn't installed on this repository, carry on with GITHUB_TOKEN.
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}
      - name: Open a revert PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          HAS_APP_TOKEN: ${{ env.HAS_APP }}
        run: |
          title=$(git log -1 --format=%s "$GITHUB_SHA")
          branch="revert/${GITHUB_SHA::12}"
          git config user.name "factory-revert"
          git config user.email "factory-revert@users.noreply.github.com"
          git switch -c "$branch"
          git revert --no-edit "$GITHUB_SHA"
          git push origin "$branch"
          note=""
          if [ "$HAS_APP_TOKEN" != "true" ]; then
            note=$'\n\nOpened with GITHUB_TOKEN, so the factory doesn\'t run on it automatically: close and reopen this PR to start it, or set the FACTORY_APP_ID and FACTORY_APP_PRIVATE_KEY secrets.'
          fi
          revert=$(gh pr create --base main --head "$branch" --label P0 \
            --title "revert: $title" \
            --body "main failed the post-merge check on $GITHUB_SHA ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)). This pure revert takes the P0 lane.$note")
          # The failure got past the PR's checks: an escape, to be closed by a
          # fix whose test fails without it (label the fix PR escape-fix).
          gh issue create --label escape \
            --title "escape: $title" \
            --body "$GITHUB_SHA passed its PR checks but failed on main ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)); reverted in $revert. Re-land it with a test at the lowest level that would have caught this, in a PR labelled escape-fix: the factory checks that the test fails without the fix."
