# The factory: one pipeline for every PR and every merge queue group, from
# humans and agents alike. The only required check is "factory/admission".
name: factory

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]
  merge_group:
  # The post-merge check: main is verified again, since without a merge queue
  # the squash commit can differ from what the PR verified.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: factory-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.sha }}
  # Only a new push cancels the run in progress: that run checked an older
  # commit. Other PR events (opened, labeled, edited) check the same commit, so
  # they wait instead. GitHub reads a required check from the commit's newest
  # run, and a cancelled newest run would block the PR, which happened when
  # opening a PR with a label started two runs in the same second.
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

env:
  NX_DAEMON: "false"
  NX_NO_CLOUD: "true"
  FACTORY_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
  FACTORY_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
  FACTORY_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
  FACTORY_OUT: factory-out
  # The gate and verify jobs run the base branch's factory, checked out under
  # .factory, so a PR is judged and recorded by the code already on main.
  FACTORY_RUN: uv run --frozen --no-config --project .factory/ci/factory .factory/ci/factory/run.py

jobs:
  gate:
    name: factory/gate
    # Runner pools are set per repository; GitHub-hosted runners by default.
    runs-on: ${{ github.event_name == 'push' && (vars.FACTORY_RUNNER_MAIN || 'ubuntu-latest') || github.event_name == 'merge_group' && (vars.FACTORY_RUNNER_QUEUE || 'ubuntu-latest') || (vars.FACTORY_RUNNER_PR || 'ubuntu-latest') }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      tier: ${{ steps.gate.outputs.tier }}
      affected: ${{ steps.gate.outputs.affected }}
      has_tools: ${{ steps.gate.outputs.has_tools }}
      escape_fix: ${{ steps.gate.outputs.escape_fix }}
      hard_minutes: ${{ steps.gate.outputs.hard_minutes }}
      owner_checks: ${{ steps.gate.outputs.owner_checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FACTORY_HEAD }}
          fetch-depth: 0
      # The gate's code and policy come from the base branch, so a PR is
      # always judged by the rules already on main, never by its own changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FACTORY_BASE }}
          path: .factory
          sparse-checkout: ci
      # The gate runs nothing the PR controls: no npm, Nx, build or script from
      # the PR checkout. It reads the PR as data from git objects (diffs,
      # service.yaml, project.json), with the base branch's code, so a PR that
      # crosses boundaries is rejected before any of its code could run.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check who added the override label
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'boundary-override')
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: $FACTORY_RUN override-check
      - name: Quarantine list
        env:
          GH_TOKEN: ${{ github.token }}
        run: $FACTORY_RUN quarantine list quarantine.json
      - name: Gate
        id: gate
        # Hard limit for the gate itself, from ci/policy/budgets.yaml.
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_QUARANTINE_FILE: quarantine.json
          FACTORY_POLICY_DIR: .factory/ci/policy
        run: $FACTORY_RUN gate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: factory-gate
          path: factory-out
          retention-days: 7

  verify:
    name: factory/verify
    needs: gate
    # Draft PRs run only the gate; build and tests start when marked ready.
    if: needs.gate.outputs.affected != '0' && !github.event.pull_request.draft
    # The tier's hard limit for PR feedback, from ci/policy/budgets.yaml.
    timeout-minutes: ${{ fromJSON(needs.gate.outputs.hard_minutes || '60') }}
    permissions:
      contents: read
      issues: read
      packages: read
    runs-on: ${{ github.event_name == 'push' && (vars.FACTORY_RUNNER_MAIN || 'ubuntu-latest') || github.event_name == 'merge_group' && (vars.FACTORY_RUNNER_QUEUE || 'ubuntu-latest') || (vars.FACTORY_RUNNER_PR || 'ubuntu-latest') }}
    env:
      FACTORY_AFFECTED: ${{ needs.gate.outputs.affected }}
      FACTORY_TOOLCHAIN_IMAGES: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FACTORY_HEAD }}
          fetch-depth: 0
          # Nothing below pushes, and the PR's code runs in this job: don't
          # leave the job token in .git/config for it to read.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The script that records results comes from the base branch, so a PR
      # can't change how its own results are written down.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FACTORY_BASE }}
          path: .factory
          sparse-checkout: ci
      # The base-branch copy is code only. Without its project.json files Nx
      # doesn't see it as a second set of projects next to the PR's own.
      - run: find .factory -name project.json -delete
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Quarantine list
        env:
          GH_TOKEN: ${{ github.token }}
        run: $FACTORY_RUN quarantine list quarantine.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: factory-gate
          path: gate
      # Verify runs the PR's code, so nothing it can read may outlive the pull.
      # The toolchain images are pulled here with a throwaway Docker config,
      # which is deleted before the first PR command; lint, build and tests
      # then find the images already local and no registry credentials.
      - name: Pull the toolchain images
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: $FACTORY_RUN prefetch-images gate/gate.json --pull
      - name: Lint
        run: $FACTORY_RUN verify-run affected format-lint lint
      # The shared BuildKit service, when the repository configures it: main
      # pushes use the main instance and write the layer cache; PRs and the
      # merge queue use the PR instance and only read it. Unset: local BuildKit.
      - uses: ./.github/actions/buildkit-service
        with:
          addr: ${{ github.event_name == 'push' && vars.FACTORY_BUILDKIT_ADDR_MAIN || github.event_name != 'push' && vars.FACTORY_BUILDKIT_ADDR || '' }}
          tls: ${{ github.event_name == 'push' && secrets.FACTORY_BUILDKIT_MAIN_TLS || github.event_name != 'push' && secrets.FACTORY_BUILDKIT_TLS || '' }}
          cache-ref: ${{ vars.FACTORY_BUILDKIT_CACHE_REF }}
          cache-write: ${{ github.event_name == 'push' }}
      # The gate computed the affected set in Python; this checks Nx sees the same graph.
      - name: Graph parity
        run: $FACTORY_RUN graph-parity
      - name: Build
        run: $FACTORY_RUN verify-run affected build build
      - name: Unit tests
        # Retries, flake confirmation and quarantine: see ci/factory/factory/flaky.py.
        env:
          FACTORY_QUARANTINE_FILE: quarantine.json
        run: $FACTORY_RUN test-run
      - name: Owners' required checks
        if: needs.gate.outputs.owner_checks != ''
        env:
          OWNER_CHECKS: ${{ needs.gate.outputs.owner_checks }}
        run: $FACTORY_RUN verify-run owners
      - name: Regression test (escape-fix)
        if: needs.gate.outputs.escape_fix == 'true'
        run: $FACTORY_RUN regression
      - name: Mutation run (R2 and above)
        if: needs.gate.outputs.tier == 'R2' || needs.gate.outputs.tier == 'R3'
        continue-on-error: true
        run: npx nx affected -t mutation --base="$FACTORY_BASE" --head="$FACTORY_HEAD" --outputStyle=static
      - name: Mutation score (R2 and above)
        if: needs.gate.outputs.tier == 'R2' || needs.gate.outputs.tier == 'R3'
        env:
          FACTORY_GATE: gate/gate.json
        run: $FACTORY_RUN mutation
      # main's coverage per project, for the ratchet. Caches saved on main are
      # readable from PRs, but a PR can't write to main's cache scope.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: factory-metrics.json
          key: factory-metrics-${{ github.run_id }}
          restore-keys: factory-metrics-
      - name: Diff coverage and ratchet
        env:
          FACTORY_GATE: gate/gate.json
          FACTORY_METRICS_FILE: factory-metrics.json
        run: $FACTORY_RUN diff-coverage
      # Simulated preview deploy on PRs: each affected project with a Helm
      # chart renders its manifests for the namespace <chart>-pr-<number> and
      # echoes "Deployment in here" (internal-tools/toolchains/helm). There is
      # no cluster yet. The merge queue and main don't deploy.
      - name: Deploy preview (simulated)
        if: github.event_name == 'pull_request'
        env:
          FACTORY_PR: ${{ github.event.pull_request.number }}
        run: npx nx affected -t deploy --base="$FACTORY_BASE" --head="$FACTORY_HEAD" --outputStyle=static
      - name: Record main's coverage
        if: github.event_name == 'push'
        run: $FACTORY_RUN metrics factory-metrics.json "$FACTORY_OUT/coverage-totals.json" "$GITHUB_SHA"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push'
        with:
          path: factory-metrics.json
          key: factory-metrics-${{ github.run_id }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: factory-verify
          path: factory-out
          retention-days: 7
      # The BuildKit client key was readable by the PR's build steps; don't
      # leave it on a runner that outlives the job.
      - name: Remove the BuildKit client key
        if: always()
        run: rm -rf "$RUNNER_TEMP/buildkit-tls"

  admission:
    name: factory/admission
    needs: [gate, verify]
    # A run cancelled by a newer push or label change decides nothing: the
    # newer run posts the decision, so no red admission is left behind.
    if: ${{ !cancelled() }}
    runs-on: ${{ github.event_name == 'push' && (vars.FACTORY_RUNNER_MAIN || 'ubuntu-latest') || github.event_name == 'merge_group' && (vars.FACTORY_RUNNER_QUEUE || 'ubuntu-latest') || (vars.FACTORY_RUNNER_PR || 'ubuntu-latest') }}
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FACTORY_BASE }}
          sparse-checkout: ci
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: hashFiles('ci/factory/run.py') == ''
        with:
          ref: ${{ env.FACTORY_HEAD }}
          sparse-checkout: ci
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: factory-*
          path: factory-in
      # What the platform says the jobs did, through the SCM adapter (ci/factory/factory/scm/).
      - name: Job results from the platform
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_REF: ${{ github.run_id }}/${{ github.run_attempt }}
        run: uv run --frozen --no-config --project ci/factory ci/factory/run.py scm jobs "$RUN_REF" > jobs.json
      - name: Workflow run from the platform
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_REF: ${{ github.run_id }}/${{ github.run_attempt }}
        run: uv run --frozen --no-config --project ci/factory ci/factory/run.py scm run "$RUN_REF" > run.json
      - name: Current approvals
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: uv run --frozen --no-config --project ci/factory ci/factory/run.py scm approvals "$PR" > approvers.json
      - name: Admission
        env:
          FACTORY_IN: factory-in
          FACTORY_OUT: .
          FACTORY_JOBS_FILE: jobs.json
          FACTORY_RUN_FILE: run.json
          FACTORY_APPROVERS_FILE: approvers.json
        run: uv run --frozen --project ci/factory ci/factory/run.py admission
      - name: Quarantine confirmed flaky tests
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen --no-config --project ci/factory ci/factory/run.py quarantine open factory-in/factory-verify/flaky.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && hashFiles('bundle.json') != ''
        with:
          name: factory-evidence
          path: bundle.json
          retention-days: 90
      - name: Post the decision on the PR
        if: always() && github.event_name == 'pull_request' && hashFiles('admission.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: uv run --frozen --no-config --project ci/factory ci/factory/run.py scm publish "$PR" admission.md '<!-- factory-admission -->'

  # A red main is reverted, not left for everyone to investigate: the factory
  # opens a P0 revert PR of the commit that failed the post-merge check.
  revert:
    name: factory/revert
    needs: admission
    if: failure() && github.event_name == 'push'
    runs-on: ${{ vars.FACTORY_RUNNER_MAIN || 'ubuntu-latest' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      HAS_APP: ${{ secrets.FACTORY_APP_PRIVATE_KEY != '' && secrets.FACTORY_APP_ID != '' }}
    steps:
      # A short-lived token for the factory GitHub App, minted from the
      # FACTORY_APP_ID and FACTORY_APP_PRIVATE_KEY secrets. Without them the
      # job falls back to GITHUB_TOKEN.
      - id: app
        if: env.HAS_APP == 'true'
        # If the App isn't installed on this repository, carry on with GITHUB_TOKEN.
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}
      # The revert runs the factory code from before the commit, so a commit
      # that breaks the factory itself can still be reverted.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.before }}
          path: .factory
          sparse-checkout: ci
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # The revert title, branch, PR and escape issue: ci/factory/factory/cli/revert.py.
      - name: Open a revert PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          HAS_APP_TOKEN: ${{ env.HAS_APP }}
          FACTORY_GIT_USER: factory-revert
        run: uv run --frozen --no-config --project .factory/ci/factory .factory/ci/factory/run.py revert
