# Nightly full test run: every project's tests, not only affected ones, to
# keep main's coverage record complete and catch drops PRs didn't touch.
# It reports, never blocks merges.
name: nightly

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  packages: read

env:
  NX_DAEMON: "false"
  NX_NO_CLOUD: "true"
  FACTORY_OUT: factory-out
  FACTORY_TOOLCHAIN_IMAGES: "true"

jobs:
  full:
    name: factory/nightly
    runs-on: ${{ vars.FACTORY_RUNNER_MAIN || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # Toolchain targets run in the images pinned in each toolchain.yaml.
      - name: Log in to GHCR for the toolchain images
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: factory-metrics.json
          key: factory-metrics-${{ github.run_id }}
          restore-keys: factory-metrics-
      - name: All tests
        run: npx nx run-many -t test --all --skip-nx-cache --outputStyle=static
      - name: Coverage and ratchet for every project
        run: uv run --frozen --project ci/factory ci/factory/run.py nightly coverage factory-metrics.json
      # Every project with a mutation target, over all of its code. Reported
      # in the run summary; it never blocks anything.
      - name: Full mutation run
        continue-on-error: true
        run: npx nx run-many -t mutation --all --outputStyle=static
      - name: Mutation scores
        run: uv run --frozen --project ci/factory ci/factory/run.py nightly mutation-summary
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: factory-metrics.json
          key: factory-metrics-${{ github.run_id }}
      - name: Open an issue for each drop
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen --project ci/factory ci/factory/run.py nightly drop-issue
