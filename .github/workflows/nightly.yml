# Nightly full test run: every project's tests, not only affected ones, to
# keep main's coverage record complete and catch drops PRs didn't touch.
# It reports, never blocks merges.
name: nightly

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  NX_DAEMON: "false"
  NX_NO_CLOUD: "true"
  FACTORY_OUT: factory-out

jobs:
  full:
    name: factory/nightly
    runs-on: ${{ vars.FACTORY_RUNNER_MAIN || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv run --frozen --project ci/factory-py ci/factory-py/run.py mise-all > mise.local.toml
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: factory-metrics.json
          key: factory-metrics-${{ github.run_id }}
          restore-keys: factory-metrics-
      - name: All tests
        run: npx nx run-many -t test --all --skip-nx-cache --outputStyle=static
      - name: Coverage and ratchet for every project
        run: |
          mkdir -p gate
          npx nx show projects --withTarget=test --json | jq -c '{affected: .}' > gate/gate.json
          FACTORY_BASE=HEAD FACTORY_HEAD=HEAD FACTORY_SHA="$GITHUB_SHA" FACTORY_GATE=gate/gate.json \
            FACTORY_METRICS_FILE=factory-metrics.json uv run --frozen --project ci/factory-py ci/factory-py/run.py diff-coverage
          cp factory-metrics.json previous-metrics.json 2>/dev/null || echo '{}' > previous-metrics.json
          uv run --frozen --project ci/factory-py ci/factory-py/run.py metrics factory-metrics.json "$FACTORY_OUT/coverage-totals.json" "$GITHUB_SHA"
      - name: Full mutation run
        # Every project with a mutation target, over all of its code. Reported
        # in the run summary; it never blocks anything.
        run: |
          npx nx run-many -t mutation --all --outputStyle=static || true
          for f in $(find . -path ./node_modules -prune -o -path '*/mutation/report.json' -print); do
            name=${f#./}; name=${name%/mutation/report.json}
            jq -r --arg p "$name" '[.files[]?.mutations[]?.status] | {k: map(select(. == "KILLED")) | length, l: map(select(. == "LIVED")) | length}
              | if .k + .l > 0 then "\($p): \((.k * 1000 / (.k + .l) | round) / 10)% of \(.k + .l) mutants killed" else "\($p): no mutants" end' "$f" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: factory-metrics.json
          key: factory-metrics-${{ github.run_id }}
      - name: Open an issue for each drop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(jq -r .status "$FACTORY_OUT/evidence/coverage-ratchet.json")
          [ "$status" = "fail" ] || { echo "No coverage drops."; exit 0; }
          details=$(jq -r .details "$FACTORY_OUT/evidence/coverage-ratchet.json")
          title="test strength dropped on main ($(date -u +%F))"
          gh issue create --repo "$GITHUB_REPOSITORY" --label test-adequacy --title "$title" \
            --body "The nightly run found coverage below the last recorded value: $details. Affected services' next PRs should restore it."
