# Fix now, test after: a merged hotfix opens an escape issue so the missing
# lower-level test isn't forgotten.
name: escapes

on:
  pull_request:
    types: [closed]

permissions:
  issues: write

jobs:
  hotfix:
    name: factory/escape
    if: github.event.pull_request.merged && contains(github.event.pull_request.labels.*.name, 'hotfix')
    runs-on: ${{ vars.FACTORY_RUNNER_MAIN || 'ubuntu-latest' }}
    steps:
      - name: Open the escape issue
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --label escape --assignee "$AUTHOR" \
            --title "escape: $TITLE (hotfix #$PR)" \
            --body "Hotfix #$PR merged without regression-test evidence. Add the missing test at the lowest level that would have caught the defect, in a PR labelled escape-fix: the factory checks that the test fails without the fix. Open escapes and their age show in the factory metrics."
