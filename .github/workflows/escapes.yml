# Fix now, test after: a merged hotfix opens an escape issue so the missing
# lower-level test isn't forgotten.
name: escapes

on:
  pull_request:
    types: [closed]

permissions:
  issues: write

jobs:
  hotfix:
    name: factory/escape
    if: github.event.pull_request.merged && contains(github.event.pull_request.labels.*.name, 'hotfix')
    runs-on: ${{ vars.FACTORY_RUNNER_MAIN || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          sparse-checkout: ci
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Open the escape issue
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: uv run --frozen --no-config --project ci/factory ci/factory/run.py escape-issue
