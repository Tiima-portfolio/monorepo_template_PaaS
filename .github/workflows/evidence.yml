# Evidence collector: links each commit on main to the evidence of the PR it
# came from, and flags commits that reached main without one (break-glass).
name: evidence

on:
  push:
    branches: [main]

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write
  pull-requests: read

jobs:
  collect:
    name: factory/evidence
    runs-on: ${{ vars.FACTORY_RUNNER_MAIN || 'ubuntu-latest' }}
    env:
      HAS_DB: ${{ secrets.FACTORY_EVIDENCE_DB_URL != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Collect
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_EVIDENCE_KEY: ${{ secrets.FACTORY_EVIDENCE_KEY }}
          FACTORY_EVIDENCE_S3_URI: ${{ vars.FACTORY_EVIDENCE_S3_URI }}
          AWS_ACCESS_KEY_ID: ${{ secrets.FACTORY_EVIDENCE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FACTORY_EVIDENCE_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ vars.FACTORY_EVIDENCE_S3_ENDPOINT }}
        run: uv run --frozen --project ci/factory-py ci/factory-py/run.py collect
      # Kept on GitHub as well, or only here when no bucket is configured.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && hashFiles('main-bundle.json') != ''
        with:
          name: factory-evidence-main
          path: main-bundle.json
          retention-days: 90
      # Signs the bundle: a GitHub artifact attestation, an in-toto statement
      # signed through Sigstore, verifiable with `gh attestation verify`.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: always() && hashFiles('main-bundle.json') != ''
        with:
          subject-path: main-bundle.json
          predicate-type: https://github.com/Tiima-portfolio/monorepo_template_PaaS/factory/evidence/v1
          predicate-path: main-bundle.json
      - name: Write the evidence index
        if: always() && hashFiles('index.sql') != '' && env.HAS_DB == 'true'
        env:
          DATABASE_URL: ${{ secrets.FACTORY_EVIDENCE_DB_URL }}
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f index.sql
