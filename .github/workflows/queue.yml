# Merge queue controller: enqueues PRs labelled "ready" by priority, with
# backpressure, rule changes merged alone, and per-agent limits.
name: queue

on:
  pull_request:
    types: [labeled]
  workflow_run:
    workflows: [factory]
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: queue-controller
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  enqueue:
    name: factory/queue
    runs-on: ${{ vars.FACTORY_RUNNER_MAIN || 'ubuntu-latest' }}
    env:
      HAS_APP: ${{ secrets.FACTORY_APP_PRIVATE_KEY != '' && secrets.FACTORY_APP_ID != '' }}
    steps:
      - id: app
        if: env.HAS_APP == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      - name: Needs the factory App
        if: steps.app.outputs.token == ''
        run: echo "::warning::The queue controller needs the factory App token; merge_group runs don't start for PRs enqueued with GITHUB_TOKEN. Skipping."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.app.outputs.token != ''
        with:
          sparse-checkout: ci
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.app.outputs.token != ''
      - name: Enqueue
        if: steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: uv run --frozen --project ci/factory ci/factory/run.py queue
