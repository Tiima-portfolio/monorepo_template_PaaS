# Publishes versioned artifacts for every service a commit on main changed.
# Nothing is deployed: delivery ends when the artifact is available.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release run at a time. A newer run may replace a waiting one; the cursor
# tag means no commit is skipped either way.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  NX_DAEMON: "false"
  NX_NO_CLOUD: "true"

jobs:
  release:
    name: factory/release
    runs-on: ${{ vars.FACTORY_RUNNER_MAIN || 'ubuntu-latest' }}
    env:
      HAS_APP: ${{ secrets.FACTORY_APP_PRIVATE_KEY != '' && secrets.FACTORY_APP_ID != '' }}
    steps:
      # A short-lived token for the factory GitHub App, minted from the
      # FACTORY_APP_ID and FACTORY_APP_PRIVATE_KEY secrets. Without them the
      # job falls back to GITHUB_TOKEN.
      - id: app
        if: env.HAS_APP == 'true'
        # If the App isn't installed on this repository, carry on with GITHUB_TOKEN.
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Toolchains for every service
        run: node ci/factory/mise-all.mjs > mise.local.toml
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
      # A BuildKit container builder, so commits from before the docker-archive
      # change, which export OCI layouts, can still be released. In the
      # air-gapped network, point driver-opts at the internal registry's
      # BuildKit image.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: ${{ vars.FACTORY_BUILDKIT_IMAGE && format('image={0}', vars.FACTORY_BUILDKIT_IMAGE) || '' }}
      - name: Release
        env:
          # The App token (contents and workflows write) can release older
          # commits after workflow files changed; GITHUB_TOKEN can't.
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          # Images go to GHCR with the workflow's own token.
          FACTORY_REGISTRY_TOKEN: ${{ github.token }}
        run: |
          git config user.name "factory-release"
          git config user.email "factory-release@users.noreply.github.com"
          node ci/factory/release-cli.mjs
