# Weekly factory metrics: flow and outcomes, posted as an issue.
name: metrics

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  report:
    name: factory/metrics
    runs-on: ${{ vars.FACTORY_RUNNER_MAIN || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen --project ci/factory ci/factory/run.py metrics-report --issue
