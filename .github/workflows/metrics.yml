# Weekly factory metrics: flow and outcomes, posted as an issue.
name: metrics

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  report:
    name: factory/metrics
    runs-on: ${{ vars.FACTORY_RUNNER_MAIN || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node ci/factory/metrics-report-cli.mjs > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          gh issue create --repo "$GITHUB_REPOSITORY" --label factory-metrics \
            --title "Factory metrics, week of $(date -u +%F)" --body-file report.md
