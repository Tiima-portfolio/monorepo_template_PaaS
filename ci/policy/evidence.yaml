# Evidence each risk tier requires before admission allows a merge.
# `mode: enforce` blocks when missing or failed; `mode: shadow` is reported but
# never blocks. New checks start in shadow mode and move to enforce once their
# shadow results show no false blocks.

evidence:
  boundary:             { mode: enforce, about: "PR stays inside one boundary" }
  title:                { mode: enforce, about: "Conventional PR title" }
  format-lint:          { mode: enforce, about: "Lint of affected projects" }
  build:                { mode: enforce, about: "Build of affected projects" }
  unit-tests:           { mode: enforce, about: "Unit tests of affected projects" }
  provenance:           { mode: enforce, about: "Agent provenance and trust level" }
  history:              { mode: enforce, about: "No merge commits in the PR" }
  dependency-rules:     { mode: shadow,  about: "Dependency directions and no cycles" }
  diff-coverage:        { mode: shadow,  about: "Changed lines covered by unit tests" }
  coverage-ratchet:     { mode: shadow,  about: "Project coverage doesn't drop below main's" }
  test-quality:         { mode: shadow,  about: "No skipped or assertion-free tests in changed files" }
  contract-tests:       { mode: shadow,  about: "Declared contracts exist; each consumes edge has a contract test in contracts/<provider>/" }
  integration-selected: { mode: shadow,  about: "Selected integration tests" }
  mutation-score:       { mode: shadow,  about: "Mutation score on the diff" }
  integration-broad:    { mode: shadow,  about: "Broad integration tests" }
  # Shadow until real owner teams exist: in a template every PR has one author.
  regression-test:      { mode: enforce, about: "escape-fix: the new test fails on the parent commit and passes with the fix" }
  owner-approval:       { mode: shadow,  about: "Approvals routed from each service's owner and guardrails.yaml" }

tiers:
  R0: [boundary, title, history, format-lint]
  R1: [boundary, title, history, format-lint, build, unit-tests, dependency-rules, diff-coverage, coverage-ratchet, test-quality, owner-approval]
  R2: [boundary, title, history, format-lint, build, unit-tests, dependency-rules, diff-coverage, coverage-ratchet, test-quality,
       contract-tests, integration-selected, mutation-score, owner-approval]
  R3: [boundary, title, history, format-lint, build, unit-tests, dependency-rules, diff-coverage, coverage-ratchet, test-quality,
       contract-tests, integration-selected, mutation-score, integration-broad, owner-approval]

# Added on top of the tier when the condition holds.
extra:
  agent: [provenance]
  tests_removed: [owner-approval]
  escape_fix: [regression-test]
