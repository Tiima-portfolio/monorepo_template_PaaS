# Where builds may fetch packages and images from.
#
# Off by default: this template runs on public GitHub-hosted runners. For an
# air-gapped install, set air_gapped: true and list only your internal mirrors
# under allowed_hosts.
air_gapped: false

allowed_hosts:
  - registry.npmjs.org
  - pypi.org
  - files.pythonhosted.org
  - proxy.golang.org
  - index.crates.io
  - static.crates.io
  - ghcr.io
  - docker.io
  # - npm.<internal-domain>
  # - registry.<internal-domain>

# Files whose added lines are checked for package or image sources.
checked_files:
  - "**/package-lock.json"
  - "**/uv.lock"
  - "**/go.sum"
  - "**/Cargo.lock"
  - "**/.npmrc"
  - "**/Dockerfile"
  - "internal-tools/toolchains/*/toolchain.yaml"
