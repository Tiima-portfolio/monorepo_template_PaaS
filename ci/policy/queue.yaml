# Merge queue controller. GitHub's merge queue has no priorities, only
# "jump to the front", so the controller decides what enters it and when.

# Label a PR "ready" to ask for a merge; priority comes from a P0..P4 label.
ready_label: ready
default_priority:
  human: P1
  agent: P3

# Backpressure: at or above this many queue entries, these priorities wait.
# P0 to P2 always enter.
hold_at_depth:
  P4: 10
  P3: 15
max_depth: 20

# Changes to the factory's own rules merge alone, so no other PR is judged by
# rules that change in the same batch.
rule_change_paths:
  - "ci/policy/**"
  - "ci/factory/**"
  - "ci/factory-py/**"
  - ".github/**"
  - "**/guardrails.yaml"

# Workspace changes (root files) rebuild every project, so they enter the queue
# only in this off-peak window (UTC hours, wrapping past midnight). P0 ignores it.
workspace_paths: [nx.json, package.json, package-lock.json, .gitignore, .node-version, .npmrc]
off_peak_utc: { from: 20, to: 6 }
